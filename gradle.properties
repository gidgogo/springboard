# --- Gradle ---
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# --- Android / Kotlin ---
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- 앱 버전 ---
# 업데이트를 낼 때마다 versionCode를 반드시 올린다 (Pleos App Market은 버전을 올리지 않은 업데이트를 반려).
app.versionCode=1
app.versionName=0.1.0

# --- 공모전 제출용 APK 이름 ---
# ./gradlew :app:exportReleaseApk 가 apk/<teamName>_<appName>_release.apk 로 복사한다.
# 블라인드 심사: 실명·소속이 드러나는 팀명/앱 이름은 쓰지 않는다.
submission.teamName=TEAM
submission.appName=Springboard
