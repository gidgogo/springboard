name: Android CI

# push: 코드가 바뀌면 빌드·테스트한다. 문서만 바뀌면 건너뛴다 (core 테스트가 읽는 docs/templates 는 포함).
# pull_request: 항상 실행한다. main 보호 규칙에서 이 검사("Build & test")를 필수로 걸어도
#               문서만 바꾼 PR 이 "대기 중"으로 멈추지 않게 하기 위함이다.
on:
  push:
    branches: ["**"]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/templates/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar 무결성 검사도 함께 한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Unit tests (core, 에뮬레이터 불필요)
        run: ./gradlew --stacktrace :core:test

      - name: Build debug APK + unit tests (app)
        run: ./gradlew --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Lint (리포트만, 빌드는 막지 않음)
        run: ./gradlew :app:lintDebug

      - name: Lint 결과 요약
        run: |
          report=app/build/reports/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; else echo "lint 텍스트 리포트 없음"; fi

      - name: Build release APK (keystore 없으면 서명되지 않은 APK)
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
          retention-days: 14
